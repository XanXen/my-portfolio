<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Space - AI智能客服</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ai-design.css">
    <script src="https://kit.fontawesome.com/4ab0ddf8ee.js" crossorigin="anonymous" defer></script>
    <style>
      /* Sub-page specific styles */
      .agent-subpage-shell {
        position: relative;
        z-index: 1;
        width: 100%;
        max-width: 1440px;
        height: 100vh;
        margin: 0 auto;
        border-radius: 20px;
        overflow: hidden;
        background: rgba(255,255,255,0.55);
        backdrop-filter: blur(40px);
        -webkit-backdrop-filter: blur(40px);
        box-shadow: 0 8px 60px rgba(130,90,228,0.08);
        display: flex;
        flex-direction: column;
      }

      /* Top bar */
      .agent-sub-topbar {
        display: flex;
        align-items: center;
        padding: 20px 28px;
        gap: 16px;
        flex-shrink: 0;
      }
      .agent-sub-back {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        background: #f1f1f1;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #825ae4;
        text-decoration: none;
        transition: all 0.2s;
      }
      .agent-sub-back:hover {
        background: #825ae4;
        color: #fff;
      }
      .agent-sub-title {
        display: flex;
        align-items: center;
        gap: 12px;
        flex: 1;
      }
      .agent-sub-icon {
        width: 40px;
        height: 40px;
        border-radius: 8px;
        background: #edaa6e;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 18px;
      }
      .agent-sub-name {
        font-size: 20px;
        font-weight: 700;
        color: #000;
      }
      .agent-sub-status {
        font-size: 12px;
        color: #55b05f;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .agent-sub-status::before {
        content: '';
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #55b05f;
      }

      /* Chat area */
      .agent-sub-chat {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 0 28px;
        min-height: 0;
      }

      .agent-sub-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .agent-sub-messages::-webkit-scrollbar { display: none; }
      .agent-sub-messages { -ms-overflow-style: none; scrollbar-width: none; }

      /* Welcome message */
      .agent-welcome {
        text-align: center;
        padding: 60px 40px;
        color: #999;
      }
      .agent-welcome-icon {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #edaa6e;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 28px;
        margin: 0 auto 16px;
      }
      .agent-welcome h2 {
        font-size: 22px;
        font-weight: 700;
        color: #333;
        margin: 0 0 8px;
      }
      .agent-welcome p {
        font-size: 14px;
        color: #8f8f8f;
        margin: 0 0 24px;
        line-height: 1.6;
      }

      /* Quick action buttons */
      .agent-quick-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .agent-quick-btn {
        padding: 8px 16px;
        border: 1px solid #e0e0e0;
        border-radius: 20px;
        background: #fff;
        font-size: 13px;
        color: #555;
        cursor: pointer;
        transition: all 0.2s;
      }
      .agent-quick-btn:hover {
        border-color: #825ae4;
        color: #825ae4;
        background: #f8f5ff;
      }

      /* Message bubbles */
      .sub-msg {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 12px;
        font-size: 14px;
        line-height: 1.6;
        word-wrap: break-word;
        animation: subMsgIn 0.3s ease;
      }
      @keyframes subMsgIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .sub-msg-user {
        align-self: flex-end;
        background: #825ae4;
        color: #fff;
        border-radius: 12px 12px 2px 12px;
      }
      .sub-msg-ai {
        align-self: flex-start;
        background: #f5f5f5;
        color: #333;
        border-radius: 12px 12px 12px 2px;
      }

      /* Input bar at bottom */
      .agent-sub-inputbar {
        padding: 16px 28px 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
      }
      .agent-sub-input {
        flex: 1;
        height: 44px;
        border: 1px solid #e0e0e0;
        background: #fff;
        border-radius: 12px;
        outline: none;
        padding: 0 16px;
        font-family: -apple-system, 'SF Pro Display', sans-serif;
        font-size: 14px;
        color: #333;
        box-sizing: border-box;
        transition: border-color 0.2s;
      }
      .agent-sub-input:focus {
        border-color: #825ae4;
      }
      .agent-sub-input::placeholder {
        color: #bbb;
      }
      .agent-sub-sendbtn {
        width: 44px;
        height: 44px;
        border: none;
        background: #825ae4;
        color: #fff;
        border-radius: 12px;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
        flex-shrink: 0;
      }
      .agent-sub-sendbtn:hover { background: #6d45d0; }

      /* Responsive */
      @media (max-width: 768px) {
        .agent-subpage-shell { border-radius: 0; }
        .agent-sub-topbar { padding: 16px; }
        .agent-sub-chat { padding: 0 16px; }
        .agent-sub-inputbar { padding: 12px 16px 16px; }
        .agent-welcome { padding: 40px 20px; }
        .lang-toggle {
          position: static !important;
          margin-left: auto !important;
          padding: 3px 8px !important;
          font-size: 10px !important;
          height: 24px !important;
          flex-shrink: 0;
        }
      }
    </style>
</head>
<body style="margin:0; padding:0; background:#f5f3ff;">

  <div class="cursor">
    <div class="cursor-big-circle"></div>
    <div class="cursor-small-circle"></div>
  </div>

  <div class="agent-page">
    <div class="agent-aura">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="agent-subpage-shell">
      <!-- Top bar -->
      <div class="agent-sub-topbar">
        <a href="ai-design.html" class="agent-sub-back" data-en="&larr; Back" data-zh="&larr; 返回">
          <i class="fa-solid fa-arrow-left"></i><span data-en=" Back" data-zh=" 返回"> Back</span>
        </a>
        <div class="agent-sub-title">
          <div class="agent-sub-icon">
            <i class="fa-solid fa-headset"></i>
          </div>
          <div>
            <div class="agent-sub-name" data-en="AI Customer Service" data-zh="AI智能客服">AI智能客服</div>
            <div class="agent-sub-status" data-en="Online" data-zh="在线">Online</div>
          </div>
        </div>
        <button class="lang-toggle" id="langToggle" aria-label="Switch language" style="margin-left:auto;border-color:#825ae4;color:#825ae4;">EN</button>
      </div>

      <!-- Chat area -->
      <div class="agent-sub-chat">
        <div class="agent-sub-messages" id="subMessages">
          <!-- Welcome -->
          <div class="agent-welcome">
            <div class="agent-welcome-icon">
              <i class="fa-solid fa-headset"></i>
            </div>
            <h2 data-en="AI Customer Service" data-zh="AI智能客服">AI智能客服</h2>
            <p data-en="Hello! I'm your AI customer service assistant. I can help you with product inquiries, after-sales service, order tracking, and more. How can I help you?" data-zh="你好！我是 AI 智能客服助手，可以帮你解答产品问题、处理售后、查询订单等。有什么我可以帮你的？">你好！我是 AI 智能客服助手，可以帮你解答产品问题、处理售后、查询订单等。有什么我可以帮你的？</p>
            <div class="agent-quick-actions">
              <button class="agent-quick-btn" data-msg="我想咨询产品信息" data-en="Product Inquiry" data-zh="产品咨询">产品咨询</button>
              <button class="agent-quick-btn" data-msg="我需要售后服务" data-en="After-Sales" data-zh="售后服务">售后服务</button>
              <button class="agent-quick-btn" data-msg="我想查询订单状态" data-en="Order Tracking" data-zh="订单查询">订单查询</button>
              <button class="agent-quick-btn" data-msg="我有其他问题需要帮助" data-en="Other Questions" data-zh="其他问题">其他问题</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Input bar -->
      <div class="agent-sub-inputbar">
        <input type="text" class="agent-sub-input" id="subInput" data-en-placeholder="Type your question..." data-zh-placeholder="输入你的问题..." placeholder="输入你的问题..." autocomplete="off" />
        <button class="agent-sub-sendbtn" id="subSend" type="button">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    (function() {
      var input = document.getElementById('subInput');
      var sendBtn = document.getElementById('subSend');
      var messages = document.getElementById('subMessages');

      function sendMessage(text) {
        if (!text) text = input.value.trim();
        if (!text) return;
        input.value = '';

        // Hide welcome on first message
        var welcome = messages.querySelector('.agent-welcome');
        if (welcome) welcome.style.display = 'none';

        // User message
        var userMsg = document.createElement('div');
        userMsg.className = 'sub-msg sub-msg-user';
        userMsg.textContent = text;
        messages.appendChild(userMsg);
        messages.scrollTop = messages.scrollHeight;

        // Simulate AI reply (will be replaced by Coze Chat SDK later)
        setTimeout(function() {
          var aiMsg = document.createElement('div');
          aiMsg.className = 'sub-msg sub-msg-ai';
          aiMsg.textContent = getReply(text);
          messages.appendChild(aiMsg);
          messages.scrollTop = messages.scrollHeight;
        }, 600);
      }

      function getReply(text) {
        if (text.includes('产品') || text.includes('咨询')) {
          return '好的，请问您想了解哪款产品呢？我可以为您详细介绍产品功能、规格和价格信息。';
        } else if (text.includes('售后') || text.includes('退')) {
          return '收到您的售后需求。请提供您的订单编号，我将为您查询并处理售后事宜。';
        } else if (text.includes('订单') || text.includes('查询')) {
          return '请提供您的订单编号或手机号，我来帮您查询订单状态。';
        } else {
          return '感谢您的提问！我正在为您查找相关信息，请稍等。如需人工服务，请输入"转人工"。';
        }
      }

      sendBtn.addEventListener('click', function() { sendMessage(); });
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
      });

      // Quick action buttons
      document.querySelectorAll('.agent-quick-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          sendMessage(btn.getAttribute('data-msg'));
        });
      });
    })();
  </script>
</body>
</html>
