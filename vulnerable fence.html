<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vulnerable Fence</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="vulnerable.css">
    <script src="https://kit.fontawesome.com/4ab0ddf8ee.js" crossorigin="anonymous" defer></script>
    <style>
        body {
            background: #000;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100svh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            font-family: 'Poppins', Arial, sans-serif;
            font-size: 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer !important;
            z-index: 1000;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        .youtube-link {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: #FFF;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            font-family: Arial, sans-serif;
            font-size: 16px;
            z-index: 1000;
        }
        .youtube-link a {
            color: #FFF;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="cursor">
        <div class="cursor-big-circle"></div>
        <div class="cursor-small-circle"></div>
    </div>

    <button class="back-btn" onclick="goBack()">&larr; Back to Game Design</button>

    <img src="images/14_.webp" class="background-image" />

    <div class="youtube-link">
        <a href="https://youtu.be/HtEZAyYq0v8" target="_blank">Watch on YouTube</a>
    </div>

    <script>
        function goBack() {
            document.body.style.transition = 'opacity 0.3s ease';
            document.body.style.opacity = '0';
            setTimeout(function() {
                window.location.href = 'game-design.html';
            }, 300);
        }

        document.addEventListener("DOMContentLoaded", function () {
            var isMobile = window.matchMedia("(max-width: 600px)").matches && "ontouchstart" in window;

            // Entrance animation (opacity only, no transform)
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.4s ease';
            requestAnimationFrame(function () {
                document.body.style.opacity = '1';
            });

            // Cursor
            if (!isMobile) {
                var cursorBig = document.querySelector(".cursor-big-circle");
                var cursorSmall = document.querySelector(".cursor-small-circle");
                if (cursorBig && cursorSmall) {
                    var styleEl = document.createElement('style');
                    styleEl.textContent = '* { cursor: none !important; }';
                    document.head.appendChild(styleEl);

                    var mouseX = 0, mouseY = 0;
                    var bigX = 0, bigY = 0, smallX = 0, smallY = 0;
                    var isFirstMove = true;

                    document.addEventListener("mousemove", function (e) {
                        mouseX = e.clientX;
                        mouseY = e.clientY;
                        if (isFirstMove) {
                            bigX = mouseX; bigY = mouseY;
                            smallX = mouseX; smallY = mouseY;
                            isFirstMove = false;
                        }
                    });

                    (function animate() {
                        bigX += (mouseX - bigX) * 0.15;
                        bigY += (mouseY - bigY) * 0.15;
                        smallX += (mouseX - smallX) * 0.25;
                        smallY += (mouseY - smallY) * 0.25;
                        cursorBig.style.left = bigX + "px";
                        cursorBig.style.top = bigY + "px";
                        cursorSmall.style.left = smallX + "px";
                        cursorSmall.style.top = smallY + "px";
                        requestAnimationFrame(animate);
                    })();
                }
            } else {
                document.querySelectorAll(".cursor-big-circle, .cursor-small-circle").forEach(function (el) { el.remove(); });
            }
        });
    </script>
</body>
</html>
