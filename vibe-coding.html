<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zenith Space - Vibe Coding Design</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/4ab0ddf8ee.js" crossorigin="anonymous" defer></script>
    <style>
        html, body {
            background: #0a0a0a !important;
            overflow: hidden;
            height: 100%;
            margin: 0;
            padding: 0;
        }
        .vibe-iframe-wrap {
            position: fixed;
            inset: 0;
            z-index: 1;
        }
        .vibe-iframe-wrap iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* J-key back hint — fixed bottom-left (desktop) */
        .back-hint {
            position: fixed;
            bottom: 28px;
            left: 28px;
            z-index: 200;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            background: rgba(20, 20, 30, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(140, 180, 255, 0.25);
            border-radius: 12px;
            color: rgba(255,255,255,0.85);
            font-family: -apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            pointer-events: none;
            animation: hintPulse 3s ease-in-out infinite;
        }
        .back-hint .key-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            background: rgba(140, 180, 255, 0.2);
            border: 1.5px solid rgba(140, 180, 255, 0.5);
            border-radius: 6px;
            font-size: 14px;
            font-weight: 700;
            color: #8cb4ff;
            flex-shrink: 0;
        }
        @keyframes hintPulse {
            0%, 100% { border-color: rgba(140, 180, 255, 0.25); box-shadow: 0 0 12px rgba(140, 180, 255, 0.06); }
            50% { border-color: rgba(140, 180, 255, 0.5); box-shadow: 0 0 20px rgba(140, 180, 255, 0.15); }
        }

        /* Press-J flash feedback */
        .back-hint.pressed .key-badge {
            background: rgba(140, 180, 255, 0.5);
            color: #fff;
            transition: background 0.1s, color 0.1s;
        }

        /* Mobile: scrollable iframe + prominent back button */
        @media only screen and (max-width: 768px) {
            html, body {
                overflow-y: auto !important;
                overflow-x: hidden !important;
                -webkit-overflow-scrolling: touch !important;
                height: auto !important;
            }
            .vibe-iframe-wrap {
                position: relative;
                width: 100%;
                height: 100vh;
                height: 100dvh;
                inset: auto;
                top: auto;
                left: auto;
            }
            .vibe-iframe-wrap iframe {
                width: 100%;
                height: 100%;
                border: none;
            }
            .back-hint {
                pointer-events: auto;
                cursor: pointer;
                top: auto;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 24px;
                font-size: 15px;
                font-weight: 600;
                border-radius: 24px;
                background: rgba(20, 20, 30, 0.85);
                animation: none;
            }
            .back-hint .key-badge {
                display: none;
            }
            .back-hint .mobile-arrow {
                display: inline;
                font-size: 18px;
            }
        }
        @media only screen and (min-width: 769px) {
            .back-hint .mobile-arrow {
                display: none;
            }
        }

        /* Page exit transition */
        .vibe-exit {
            animation: vibeOut 0.4s ease-in forwards;
        }
        @keyframes vibeOut {
            to { opacity: 0; transform: scale(0.97); }
        }
    </style>
</head>
<body>
    <div class="cursor">
        <div class="cursor-big-circle"></div>
        <div class="cursor-small-circle"></div>
    </div>

    <div class="vibe-iframe-wrap">
        <iframe src="vibe-coding/index.html" allow="camera;microphone" allowfullscreen></iframe>
    </div>

    <button class="lang-toggle" id="langToggle" aria-label="Switch language" style="position:fixed;top:13px;right:60px;z-index:9999;border-color:#fff;color:#fff;background:rgba(0,0,0,0.4);backdrop-filter:blur(8px);">EN</button>

    <div class="back-hint" id="backHint">
        <span class="mobile-arrow">&larr;</span>
        <span class="key-badge">J</span>
        <span data-en="Press to go back" data-zh="按键返回">Press to go back</span>
    </div>

    <script src="script.js"></script>
    <script>
        (function() {
            var navigating = false;

            function goBack() {
                if (navigating) return;
                navigating = true;
                var hint = document.querySelector('.back-hint');
                if (hint) hint.classList.add('pressed');
                document.body.classList.add('vibe-exit');
                setTimeout(function() {
                    window.location.href = 'index.html#services';
                }, 350);
            }

            // Listen on parent page
            document.addEventListener('keydown', function(e) {
                if (e.key === 'j' || e.key === 'J') goBack();
            });

            // Mobile: tap back hint to go back
            var backHint = document.getElementById('backHint');
            if (backHint) {
                backHint.addEventListener('click', goBack);
                backHint.addEventListener('touchend', function(e) {
                    e.preventDefault();
                    goBack();
                });
            }

            // Listen for postMessage from iframe (when iframe has focus)
            window.addEventListener('message', function(e) {
                if (e.data && e.data.type === 'vibe-back') goBack();
            });
        })();
    </script>
</body>
</html>
